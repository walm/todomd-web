<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Added to a home screen, it opens as its own app rather than a tab. -->
    <meta name="apple-mobile-web-app-title" content="TodoMD" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#181b20" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint, so a dark board doesn't
      // flash white on load. Key must match components/theme-toggle.tsx.
      try {
        var saved = localStorage.getItem('todomd-web:theme') || 'system'
        var dark =
          saved === 'dark' ||
          (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <title>TodoMD</title>
    <script type="module" crossorigin src="/assets/index-CRdyGNZv.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CohsdNcy.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
