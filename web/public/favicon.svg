<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- todomd-web: todomd's dark tile and MD badge, with its checklist swapped
       for the board this tool puts on screen. One card carries the green
       outline the UI uses for "an agent touched this". -->
  <rect x="32" y="32" width="960" height="960" rx="232" fill="#181b20"/>

  <g fill="#22262e">
    <rect x="128" y="176" width="240" height="536" rx="36"/>
    <rect x="392" y="176" width="240" height="536" rx="36"/>
    <rect x="656" y="176" width="240" height="536" rx="36"/>
  </g>

  <g fill="#f4f6f8">
    <rect x="160" y="216" width="176" height="112" rx="24"/>
    <rect x="160" y="360" width="176" height="112" rx="24"/>
    <rect x="688" y="216" width="176" height="112" rx="24"/>
  </g>

  <rect x="424" y="216" width="176" height="112" rx="24" fill="#22262e" stroke="#7ee23e" stroke-width="16"/>
  <circle cx="472" cy="272" r="18" fill="#7ee23e"/>

  <rect x="600" y="772" width="296" height="148" rx="40" fill="none" stroke="#1a8cff" stroke-width="24"/>
  <text x="748" y="874" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="#1a8cff" text-anchor="middle">MD</text>
</svg>
